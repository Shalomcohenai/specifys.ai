<style id="critical-shell">
  .hidden{display:none}
  *,*::before,*::after{box-sizing:border-box}
  html{font-size:16px}
  body{margin:0;min-height:100vh;background:#f5f5f5;color:#333;font-family:Montserrat,Arial,sans-serif;font-size:1rem;line-height:1.5}
  a{color:#9A3412;text-decoration:none}
  .thematic-header{display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;z-index:99999;min-height:56px;padding:10px 20px;background:#f5f5f5;border-bottom:1px solid #dee2e6}
  .header-left,.header-right{display:flex;align-items:center;flex:1;min-width:0;gap:.5rem}
  .header-nav{display:flex;align-items:center;gap:1rem}
  .header-nav a{color:#333;font-size:.75rem;font-weight:700;white-space:nowrap}
  .header-menu-toggle{display:none;width:44px;height:44px}
  .header-center{display:flex;justify-content:center;align-items:center;position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .header-center .logo{pointer-events:auto}
  .logo a,.logo-text{font-size:1.2rem;font-weight:700;color:#333;text-decoration:none;line-height:1}
  #main-content{padding-bottom:88px}
  @media (max-width:768px){
    .header-nav{display:none}
    .header-menu-toggle{display:inline-flex}
    .thematic-header{height:56px;padding:8px 12px}
    .logo a,.logo-text{font-size:1.1rem}
  }
  @media (max-width:480px){
    .thematic-header{padding:8px}
    .logo a,.logo-text{font-size:1rem}
  }
</style>
