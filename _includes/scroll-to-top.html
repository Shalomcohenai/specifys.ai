<!-- Scroll to top button -->
<button class="icon-btn scroll-to-top" id="scrollToTop" aria-label="Scroll">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
  // Scroll button functionality
  document.addEventListener('DOMContentLoaded', function() {
    const scrollBtn = document.getElementById('scrollToTop');
    
    if (scrollBtn) {
      // Handle click - scroll to top or bottom based on current state
      function buttonCoversCompare() {
        const compare = document.querySelector('.plan-compare');
        if (!compare) return false;
        const rect = compare.getBoundingClientRect();
        return rect.top < window.innerHeight - 8 && rect.bottom > window.innerHeight - 72;
      }

      function syncScrollButton() {
        const far = window.scrollY > Math.max(480, window.innerHeight * 0.75);
        if (far) {
          scrollBtn.classList.add("scrolled-down");
          scrollBtn.setAttribute("aria-label", "Scroll to top");
        } else {
          scrollBtn.classList.remove("scrolled-down");
          scrollBtn.setAttribute("aria-label", "Scroll to bottom");
        }
        scrollBtn.classList.toggle("is-parked", !far || buttonCoversCompare());
      }

      scrollBtn.addEventListener("click", () => {
        if (window.scrollY > 480) {
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        }
      });

      window.addEventListener("scroll", syncScrollButton, { passive: true });
      syncScrollButton();
    }
  });
</script>
