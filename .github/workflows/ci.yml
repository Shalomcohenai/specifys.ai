name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npm run lint
          else
            echo "No linting configuration found, skipping..."
          fi

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build CSS
        run: npm run build:css

      - name: Build with Vite
        run: npm run build:vite

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Verify build output
        run: |
          test -d _site
          test -f _site/index.html
          test -f _site/pages/pricing.html

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: backend

      - name: Run frontend unit tests
        run: node --test assets/js/features/*.test.js

      - name: Run backend unit tests
        run: node --test backend/server/*.test.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Serve the repo for browser specs
        run: |
          python3 -m http.server 4000 >/tmp/playwright-server.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:4000/; then
              exit 0
            fi
            sleep 0.2
          done
          echo "Static server did not start" >&2
          cat /tmp/playwright-server.log >&2
          exit 1

      - name: Run Playwright specs
        run: npx playwright test
